name: Verify MY WORLD local build

on:
  push:
    branches:
      - feature/digital-psyche-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/my-world-release"
          cat .deploy/archive-parts/part-*.b64 | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/my-world-release/source.zip"
          unzip -q "$RUNNER_TEMP/my-world-release/source.zip" -d "$RUNNER_TEMP/my-world-release"
          test -f "$RUNNER_TEMP/my-world-release/MY_WORLD_0_5/src/core.js"
          echo "PROJECT_DIR=$RUNNER_TEMP/my-world-release/MY_WORLD_0_5" >> "$GITHUB_ENV"

      - name: Apply cognitive and self-hosted overlay
        run: node .deploy/overlays/apply.mjs "$PROJECT_DIR"

      - name: Install dependencies and run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund
          npm test

      - name: Package verified build
        if: success()
        run: |
          cd "$PROJECT_DIR"
          zip -qr "$RUNNER_TEMP/MY_WORLD-local-build.zip" . -x "node_modules/*" ".git/*" ".my-world-data/*"

      - name: Upload verified build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MY_WORLD-local-build
          path: ${{ runner.temp }}/MY_WORLD-cognitive-build.zip
          retention-days: 7

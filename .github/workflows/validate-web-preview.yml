name: Validate MY WORLD V6 web preview

on:
  push:
    branches:
      - web-preview
      - my-world-v6-dual-ai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract and syntax-check the app module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          modules = re.findall(r'<script\\b(?=[^>]*\\btype=["\\']module["\\'])[^>]*>(.*?)</script>', html, flags=re.I | re.S)
          if len(modules) != 1:
              raise SystemExit(f"Expected one app module, found {len(modules)}")
          Path("/tmp/my-world-app.mjs").write_text(modules[0], encoding="utf-8")
          required = [
              "RP_CORE_PROMPT",
              "bookRpPrompt",
              "bookRpExampleReply",
              "compactChatMessages",
              "message-thought",
              "copyMessageAt",
              "Думает",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing required RP features: " + ", ".join(missing))
          print("Embedded module extracted; all RP feature markers found.")
          PY
          node --check /tmp/my-world-app.mjs

      - name: Check standalone page size and markers
        shell: bash
        run: |
          test -s index.html
          test "$(wc -c < index.html)" -gt 100000
          echo "Single-file MY WORLD page is present."

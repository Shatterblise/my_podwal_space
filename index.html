<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0d0b">
<title>MY WORLD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0e0d0b;color:#e9e3d6;font:14px Inter,system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(420px,100%);text-align:center;padding:34px 26px;border:1px solid #30291f;border-radius:18px;background:#151310;box-shadow:0 20px 70px #0008}
.brand{font-size:28px;letter-spacing:.17em;font-weight:800;color:#e2a64b}
.sub{margin:12px 0 26px;color:#9a9282;font-size:13px;line-height:1.55}
.track{height:4px;background:#30291f;border-radius:10px;overflow:hidden}
#progress{height:100%;width:3%;background:#e2a64b;transition:width .2s}
#status{font-size:12px;color:#c9bda8;margin:15px 0 6px}
small{font-size:10px;color:#766e62}
#error{display:none;text-align:left;color:#e2b2a5;font-size:12px;line-height:1.5;margin-top:18px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <div class="brand">MY WORLD</div>
  <div class="sub">Открываю приложение и его рабочие модули…</div>
  <div class="track"><div id="progress"></div></div>
  <div id="status">Подготовка интерфейса</div>
  <small>Первый экран загружается из опубликованной сборки.</small>
  <div id="error"></div>
</main>
<script>
(async()=>{
 const status=document.getElementById('status');
 const bar=document.getElementById('progress');
 const fail=message=>{status.textContent='Не удалось загрузить приложение';document.getElementById('error').style.display='block';document.getElementById('error').textContent=message;};
 try{
  if(!('DecompressionStream' in window)) throw new Error('Нужен актуальный браузер Chrome или Edge с поддержкой распаковки gzip.');
  const base='https://rawcdn.githack.com/Shatterblise/my_podwal_space/f584600280bd3f899fd9bd383dee8c05ea15d978/assets/';
  const parts=8;
  const chunks=[];
  for(let i=1;i<=parts;i++){
   status.textContent='Загрузка приложения · '+i+' / '+parts;
   const response=await fetch(base+'p'+String(i).padStart(2,'0')+'.txt',{cache:'no-store'});
   if(!response.ok) throw new Error('Файл приложения '+i+' не получен (HTTP '+response.status+').');
   chunks.push((await response.text()).trim());
   bar.style.width=Math.round(i/parts*100)+'%';
  }
  status.textContent='Распаковка и запуск…';
  const binary=atob(chunks.join(''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.includes('MY WORLD')||!html.includes('Qwen2.5-0.5B-Instruct-q4f16_1-MLC')) throw new Error('Проверка сборки не пройдена: содержимое неполное.');
  document.open();document.write(html);document.close();
 }catch(error){fail(error&&error.message?error.message:String(error));}
})();
</script>
</body>
</html>
